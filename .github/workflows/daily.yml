name: FPL daily brief

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      deadline:
        description: 'Deadline pack (richer output for decision day)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git
        run: |
          git config user.name "fpld-bot"
          git config user.email "fpld-bot@users.noreply.github.com"

      - name: Copy config and restore databases
        run: |
          mkdir -p ~/.fpld
          cp config.json ~/.fpld/
          # Restore persistent databases from repo
          cp -f data/league.db ~/.fpld/league.db 2>/dev/null || true
          cp -f data/xpts.db ~/.fpld/xpts.db 2>/dev/null || true
          cp -f data/xpts_model.json ~/.fpld/xpts_model.json 2>/dev/null || true
          cp -f data/xpts_predictions.json ~/.fpld/xpts_predictions.json 2>/dev/null || true
          cp -f data/state.json ~/.fpld/state.json 2>/dev/null || true
          cp -f data/players.json ~/.fpld/players.json 2>/dev/null || true

      - name: Run daily brief
        run: python3 fpld_brief.py --print --json

      - name: Sync league data
        run: python3 fpld_league.py --sync --report --quiet || true
        # || true: league sync fails pre-GW1 (no scored data yet)

      - name: Update xPts predictions
        run: |
          # --predict is cheap (uses existing model + fresh bootstrap data).
          # --pull and --train only run on Mondays (after GWs are scored).
          DOW=$(date +%u)  # 2=Tuesday
          if [ "$DOW" = "2" ]; then
            python3 fpld_xpts.py --pull --train --predict --league
          elif [ -f data/xpts_model.json ]; then
            python3 fpld_xpts.py --predict --league
          else
            echo "No model yet — skipping predict (will train on Monday)"
          fi

      - name: Persist databases and commit output
        run: |
          mkdir -p data/briefs data/reports
          DOW=$(date +%u)  # 1=Monday

          # Always copy briefs and reports
          cp -f ~/.fpld/briefs/*.md data/briefs/ 2>/dev/null || true
          cp -f ~/.fpld/reports/*.md data/reports/ 2>/dev/null || true

          # Persist databases — must survive between runs (runners are ephemeral)
          cp -f ~/.fpld/league.db data/league.db 2>/dev/null || true
          cp -f ~/.fpld/xpts.db data/xpts.db 2>/dev/null || true
          cp -f ~/.fpld/xpts_model.json data/xpts_model.json 2>/dev/null || true
          cp -f ~/.fpld/xpts_predictions.json data/xpts_predictions.json 2>/dev/null || true
          cp -f ~/.fpld/state.json data/state.json 2>/dev/null || true
          cp -f ~/.fpld/players.json data/players.json 2>/dev/null || true
          cp -f ~/.fpld/brief.json data/brief.json 2>/dev/null || true

          git add data/
          git diff --cached --quiet || git commit -m "Daily brief $(date +%Y-%m-%d)"
          git push

      - name: Close previous issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Close ALL open daily-brief issues (new one replaces them)
          gh issue list --label "daily-brief" --state open --json number --jq '.[].number' \
            | xargs -I {} gh issue close {} 2>/dev/null || true
          # Close deadline-pack issues older than 3 days
          gh issue list --label "deadline-pack" --state open --json number,createdAt \
            --jq '.[] | select(.createdAt < (now - 259200 | strftime("%Y-%m-%dT%H:%M:%SZ"))) | .number' \
            | xargs -I {} gh issue close {} 2>/dev/null || true

      - name: Create GitHub Issue with brief
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          BRIEF_FILE="data/briefs/${TODAY}.md"
          REPORT_FILE=$(ls -t data/reports/league-*.md 2>/dev/null | head -1)
          LABEL="daily-brief"

          if [ "${{ inputs.deadline }}" = "true" ]; then
            LABEL="deadline-pack"
          fi

          if [ -f "$BRIEF_FILE" ]; then
            BODY=$(head -c 30000 "$BRIEF_FILE")

            # Append league report if it exists (deadline pack or daily)
            if [ -n "$REPORT_FILE" ] && [ -f "$REPORT_FILE" ]; then
              BODY="${BODY}

          ---

          $(head -c 30000 "$REPORT_FILE")"
            fi

            # Truncate to GitHub's 65000 char limit
            BODY=$(echo "$BODY" | head -c 65000)

            gh issue create \
              --title "${LABEL}: ${TODAY}" \
              --body "$BODY" \
              --label "$LABEL"
          fi

  scout:
    needs: brief
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest issue body
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(gh issue list --label "daily-brief" --state open --json body --jq '.[0].body' 2>/dev/null || true)
          if [ -z "$BODY" ]; then
            BODY=$(gh issue list --label "deadline-pack" --state open --json body --jq '.[0].body' 2>/dev/null || true)
          fi
          if [ -z "$BODY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "body<<BRIEF_EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" | head -c 30000 >> "$GITHUB_OUTPUT"
            echo "BRIEF_EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Get issue number for comment
        if: steps.issue.outputs.skip != 'true'
        id: num
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --label "daily-brief" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            NUM=$(gh issue list --label "deadline-pack" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Scout brief
        if: steps.issue.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          trigger_phrase: ""
          use_bedrock: false
          claude_args: "--allowedTools Bash,Read,Grep,Glob,WebSearch,WebFetch"
          prompt: |
            You are the FPL manager's autonomous scout. A daily brief has just been posted. Read it and decide what's worth investigating.

            Look for:
            1. **Flagged players** — anyone with an injury flag. Search the web for current status.
            2. **Price watch** — anyone about to rise or fall. Flag urgency if rising tonight.
            3. **Deadline proximity** — if <24h away, be thorough. If 4+ days, be brief.
            4. **Transfer proposals** — scout the top candidate (fitness, nailed status).
            5. **Nothing actionable** — say so in one line. Don't pad.

            Rules:
            - Be concise. Lead with the most important finding.
            - If you search the web, cite what you found.
            - End with **Action needed: Yes/No**.
            - If nothing to report: "Squad clean, no flags, no urgent moves."

            The playbook is in docs/playbook.md. Config is in config.json.

            Post your findings as a comment on issue #${{ steps.num.outputs.number }}.

            Here is the brief:
            ${{ steps.issue.outputs.body }}
