name: FPL deadline pack (manual)

# Dynamic deadline detection runs in daily.yml automatically.
# This workflow is a manual fallback — it dispatches the daily workflow
# with force_deadline=true, so the full pipeline runs and labels the
# issue as a deadline-pack.

on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch daily workflow as deadline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "FPL daily brief" \
            --repo "${{ github.repository }}" \
            -f force_deadline=true
          echo "Dispatched daily workflow with force_deadline=true"
