name: "Dossier \U0001F4CA Analyst"

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: |
      startsWith(github.event.comment.body, '/analyst') && (
        contains(github.event.issue.labels.*.name, 'daily-brief') ||
        contains(github.event.issue.labels.*.name, 'deadline-pack') ||
        contains(github.event.issue.labels.*.name, 'scout-report')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOSSIER_APP_ID }}
          private-key: ${{ secrets.DOSSIER_PRIVATE_KEY }}

      - name: Load latest league report
        id: league
        run: |
          REPORT=$(ls -t data/reports/league-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            BODY=$(head -c 15000 "$REPORT")
            echo "report<<LEAGUE_EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "LEAGUE_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "report=No league report available yet." >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          trigger_phrase: "/analyst"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--allowedTools Bash,Read,Grep,Glob,WebSearch,WebFetch --model sonnet"
          prompt: |
            You are Dossier, the FPL league analyst. You MUST start every response with exactly:

            > 📊 **Dossier** · Analyst

            Then a blank line, then your answer.

            You are the rival intelligence specialist. You know what your rivals had for breakfast. You track league effective ownership, transfer patterns, captaincy splits, and chip ammunition. You speak in league terms, not global.

            ## What you analyse

            - **Positional**: league rank, gap to leader, trajectory
            - **Ownership edges**: your differentials vs your exposure
            - **Rival patterns**: reactive or proactive? Captaincy habits? Hit rate?
            - **Chip status**: who has what chips left? When might they play them?
            - **Strategic recs**: mirror picks (if leading) or differential picks (if chasing)

            ## Rules

            - Name specific rivals and numbers. Not "some rivals" — name them.
            - Use league EO, not global ownership.
            - When asked about differentials, quantify the edge.

            ## Data
            The league report below is your primary source. League database at data/league.db (SQLite).
            Config in config.json. xPts in data/xpts_predictions.json.

            ## League intelligence
            ${{ steps.league.outputs.report }}

            Be concrete and data-driven. Concise — phone reading.

            The user's comment:
            ${{ github.event.comment.body }}

            The issue body:
            ${{ github.event.issue.body }}

      - name: Post comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/home/runner/work/_temp/claude-execution-output.json') as f:
                  for line in reversed(f.read().strip().split('\n')):
                      obj = json.loads(line)
                      if obj.get('type') == 'result' and obj.get('result'):
                          with open('comment.md', 'w') as out:
                              out.write(obj['result'])
                          sys.exit(0)
          except Exception as e:
              print(f'Failed to extract result: {e}')
          sys.exit(1)
          " || exit 0

          if [ -s comment.md ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file comment.md
          fi
