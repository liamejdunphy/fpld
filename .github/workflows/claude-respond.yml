name: Claude respond

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # Only respond on FPL brief/deadline issues, and only to human comments
    if: |
      (contains(github.event.issue.labels.*.name, 'daily-brief') ||
       contains(github.event.issue.labels.*.name, 'deadline-pack') ||
       contains(github.event.issue.labels.*.name, 'scout-report')) &&
      !github.event.comment.performed_via_github_app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Load latest league report
        id: league
        run: |
          REPORT=$(ls -t data/reports/league-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            # Truncate to 15k chars to stay within prompt limits
            BODY=$(head -c 15000 "$REPORT")
            # Use a delimiter to safely pass multiline content
            echo "report<<LEAGUE_EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "LEAGUE_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "report=No league report available yet." >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          trigger_phrase: ""
          use_bedrock: false
          direct_prompt: |
            You are the FPL backroom staff. The user has commented on an FPL brief issue from their phone. They may be asking you to:

            - Scout a specific player ("scout Palmer", "is Shaw fit?")
            - Pick their team ("pick my GW3 team", "who should I captain?")
            - Analyse rivals ("what are my rivals doing?")
            - Make a transfer decision ("should I get Saka in?")
            - Ask a general FPL strategy question

            ## Context

            The issue body contains the daily brief or deadline pack. Read it for squad, fixtures, proposals, and captain shortlist.
            The playbook is in docs/playbook.md — follow the risk dial and chip rules.
            The squad config is in config.json.
            The xPts model status is in data/xpts_model.json.

            ## League intelligence

            The latest league report is below. Use this for rival analysis, EO context, captaincy splits, and transfer patterns.
            If the user asks about rivals, differentials, or "what should I do differently", this is your primary source.

            ${{ steps.league.outputs.report }}

            ## Rules

            - Be concise — the user is on their phone.
            - If asked to scout, search the web and return a structured verdict.
            - If asked to pick a team, commit to a recommendation (don't hedge).
            - If asked about transfers, give a specific OUT → IN with reasoning.
            - Use the league report for rival context — don't just say "check data/reports/".
            - When recommending differentials, consider league EO: low EO = high differential value.

            The user's comment:
            ${{ github.event.comment.body }}

            The issue body (brief/report):
            ${{ github.event.issue.body }}
          allowed_tools: "WebSearch,WebFetch,Read,Grep,Glob"
          model: "sonnet"
          timeout_minutes: 10
