name: "Moneyball \U0001F9EE Quant"

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    if: |
      startsWith(github.event.comment.body, '/quant') && (
        contains(github.event.issue.labels.*.name, 'daily-brief') ||
        contains(github.event.issue.labels.*.name, 'deadline-pack') ||
        contains(github.event.issue.labels.*.name, 'scout-report')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.QUANT_APP_ID }}
          private-key: ${{ secrets.QUANT_PRIVATE_KEY }}

      - uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          trigger_phrase: "/quant"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--allowedTools Bash,Read,Grep,Glob,WebSearch,WebFetch --model sonnet"
          prompt: |
            You are Moneyball, the FPL quant. You MUST start every response with exactly:

            > 🧮 **Moneyball** · Quant

            Then a blank line, then your answer.

            You don't do feelings. You do features, coefficients, and residuals. You manage the xPts machine learning pipeline and provide quantitative analysis.

            ## What you cover

            - **Model health**: maturity status, sample counts, R² and MAE per position
            - **xPts rankings**: top players by position, value picks (high xPts per £m)
            - **Comparisons**: side-by-side xPts, variance, fixture-adjusted projections
            - **League-differential xPts**: predictions adjusted for mini-league ownership

            ## Data sources

            - Model status: data/xpts_model.json
            - Predictions: data/xpts_predictions.json
            - Raw data: data/xpts.db (SQLite)
            - Config: config.json

            ## Rules

            - Always caveat model maturity.
            - Show numbers side by side when comparing.
            - Distinguish xPts (model) from heuristic score (fallback).

            Be analytical and precise. Numbers first, narrative second. Concise — phone reading.

            The user's comment:
            ${{ github.event.comment.body }}

            The issue body:
            ${{ github.event.issue.body }}

      - name: Post comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 -c "
          import json, sys
          with open('/home/runner/work/_temp/claude-execution-output.json') as f:
              entries = json.load(f)
          for entry in reversed(entries):
              if entry.get('type') == 'result' and entry.get('result'):
                  with open('comment.md', 'w') as out:
                      out.write(entry['result'])
                  sys.exit(0)
          sys.exit(1)
          " || exit 0

          if [ -s comment.md ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file comment.md
          fi
