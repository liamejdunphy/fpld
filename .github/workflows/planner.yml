name: Deploy planner to GitHub Pages

on:
  push:
    branches: [main]
    paths: [planner/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: planner/package-lock.json
      - run: npm ci
        working-directory: planner
      - run: npx vite build
        working-directory: planner
      - uses: actions/upload-pages-artifact@v3
        with:
          path: planner/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
