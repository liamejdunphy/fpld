name: "Gaffer \U0001F4CB Manager"

on:
  issue_comment:
    types: [created]

jobs:
  manager:
    if: |
      startsWith(github.event.comment.body, '/gaffer') && (
        contains(github.event.issue.labels.*.name, 'daily-brief') ||
        contains(github.event.issue.labels.*.name, 'deadline-pack') ||
        contains(github.event.issue.labels.*.name, 'scout-report')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GAFFER_APP_ID }}
          private-key: ${{ secrets.GAFFER_PRIVATE_KEY }}

      - name: Load latest league report
        id: league
        run: |
          REPORT=$(ls -t data/reports/league-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            BODY=$(head -c 15000 "$REPORT")
            echo "report<<LEAGUE_EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "LEAGUE_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "report=No league report available yet." >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          trigger_phrase: "/gaffer"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--allowedTools Bash,Read,Grep,Glob,WebSearch,WebFetch --model sonnet"
          prompt: |
            You are the Gaffer, FPL manager and director of football. You MUST start every response with exactly:

            > 📋 **Gaffer** · Manager

            Then a blank line, then your answer.

            You handle the big picture: sequencing transfers across gameweeks, timing chips, deciding when to roll FTs vs spend. You think in windows, not weeks.

            ## What you do

            - **Transfer decisions**: specific OUT → IN with timing.
            - **Hit decisions**: quantify it. "Taking a -4 nets you +6.2 xPts over 3 GWs."
            - **Chip timing**: follow the playbook calendar in docs/playbook.md.
            - **5-GW planning**: reference the plans in data/brief.json if available.

            ## Context
            Config in config.json. Playbook in docs/playbook.md. Plans in data/brief.json.

            ## League intelligence
            ${{ steps.league.outputs.report }}

            Be strategic but decisive. Commit to recommendations. Concise — phone reading.

            The user's comment:
            ${{ github.event.comment.body }}

            The issue body:
            ${{ github.event.issue.body }}

      - name: Post comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/home/runner/work/_temp/claude-execution-output.json') as f:
                  for line in reversed(f.read().strip().split('\n')):
                      obj = json.loads(line)
                      if obj.get('type') == 'result' and obj.get('result'):
                          with open('comment.md', 'w') as out:
                              out.write(obj['result'])
                          sys.exit(0)
          except Exception as e:
              print(f'Failed to extract result: {e}')
          sys.exit(1)
          " || exit 0

          if [ -s comment.md ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file comment.md
          fi

  # /claude catch-all defaults to the Gaffer
  claude-catchall:
    if: |
      startsWith(github.event.comment.body, '/claude') && (
        contains(github.event.issue.labels.*.name, 'daily-brief') ||
        contains(github.event.issue.labels.*.name, 'deadline-pack') ||
        contains(github.event.issue.labels.*.name, 'scout-report')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GAFFER_APP_ID }}
          private-key: ${{ secrets.GAFFER_PRIVATE_KEY }}

      - name: Load latest league report
        id: league
        run: |
          REPORT=$(ls -t data/reports/league-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ] && [ -f "$REPORT" ]; then
            BODY=$(head -c 15000 "$REPORT")
            echo "report<<LEAGUE_EOF" >> "$GITHUB_OUTPUT"
            echo "$BODY" >> "$GITHUB_OUTPUT"
            echo "LEAGUE_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "report=No league report available yet." >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          trigger_phrase: "/claude"
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: "--allowedTools Bash,Read,Grep,Glob,WebSearch,WebFetch --model sonnet"
          prompt: |
            You are the Gaffer, FPL manager. The user addressed you as @claude (the catch-all).

            You MUST start every response with exactly:

            > 📋 **Gaffer** · Manager

            Then a blank line, then your answer.

            If the question is clearly about scouting, mention they can try `/scout` for a direct line to Radar.
            Similarly: `/coach` for team selection, `/analyst` for rival intel, `/quant` for model questions.

            ## What you do

            - **Transfer decisions**: specific OUT → IN with timing.
            - **Hit decisions**: quantify the trade-off.
            - **Chip timing**: follow docs/playbook.md.
            - **5-GW planning**: reference data/brief.json plans.
            - **General questions**: answer and suggest the right staff member.

            ## Context
            Config in config.json. Playbook in docs/playbook.md. Plans in data/brief.json.

            ## League intelligence
            ${{ steps.league.outputs.report }}

            Be strategic but decisive. Concise — phone reading.

            The user's comment:
            ${{ github.event.comment.body }}

            The issue body:
            ${{ github.event.issue.body }}

      - name: Post comment
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python3 -c "
          import json, sys
          try:
              with open('/home/runner/work/_temp/claude-execution-output.json') as f:
                  for line in reversed(f.read().strip().split('\n')):
                      obj = json.loads(line)
                      if obj.get('type') == 'result' and obj.get('result'):
                          with open('comment.md', 'w') as out:
                              out.write(obj['result'])
                          sys.exit(0)
          except Exception as e:
              print(f'Failed to extract result: {e}')
          sys.exit(1)
          " || exit 0

          if [ -s comment.md ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file comment.md
          fi
