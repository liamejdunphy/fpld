name: Claude scout

on:
  issues:
    types: [opened]

jobs:
  scout:
    # Only run on daily-brief or deadline-pack issues
    if: contains(github.event.issue.labels.*.name, 'daily-brief') || contains(github.event.issue.labels.*.name, 'deadline-pack')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          trigger_phrase: ""
          use_bedrock: false
          direct_prompt: |
            You are the FPL manager's autonomous scout. A daily brief has just been posted as a GitHub Issue. Read the issue body carefully and decide what's worth investigating.

            ## Your job

            Read the brief below and look for:

            1. **Flagged players** — anyone in the squad with an injury flag (⚠️, yellow, red). If found, search the web for their current status and expected return.
            2. **Price watch** — anyone about to rise or fall in price. If a target is rising tonight, flag urgency.
            3. **Deadline proximity** — if the deadline is <24h away, be more thorough. If it's 4+ days away, be brief.
            4. **Transfer proposals** — if the brief suggests replacements, quickly scout the top candidate (fitness, nailed status).
            5. **Nothing actionable** — if the squad is clean, no flags, no urgent price moves, and the deadline is days away, say so in one line. Don't pad.

            ## Output rules

            - Be concise. This is a GitHub Issue comment, not an essay.
            - Lead with the most important finding.
            - If you scout a player via web search, cite what you found.
            - End with a clear **Action needed: Yes/No** line.
            - On deadline day (deadline <24h), add a captain recommendation and any last-minute intel.
            - If there's genuinely nothing to report, just comment: "✅ Squad clean, no flags, no urgent moves. Next check tomorrow."

            ## Context

            The user's playbook is in docs/playbook.md — read it for risk dial thresholds and chip strategy.
            The current squad and config are in config.json.
            The xPts model status is in data/xpts_model.json.

            Here is the brief:

            ${{ github.event.issue.body }}
          allowed_tools: "WebSearch,WebFetch,Read,Grep,Glob"
          model: "sonnet"
          timeout_minutes: 10
